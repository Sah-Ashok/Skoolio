# =============================================================
#  Skoolio – Development overrides
#
#  Usage:
#    docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
#  What changes vs production:
#    • Backend  : source mounted, runs nodemon (hot reload)
#    • Frontend : source mounted, runs next dev (hot reload)
#    • Backend port 5001 exposed to host (Postman / curl)
#    • Redis port 6379 exposed to host (Redis Insight / CLI)
# =============================================================

services:

  redis:
    # Expose Redis to host in dev for inspection
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
      target: builder
    volumes:
      - ./Backend/src:/app/src
      - ./Backend/server.ts:/app/server.ts
    environment:
      NODE_ENV: development
      PORT: 5001
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
    ports:
      - "5001:5001"
    command: ["npm", "run", "dev"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    environment:
      NODE_ENV: development
      PORT: 3000
      NEXT_PUBLIC_API_URL: /api
    command: ["npm", "run", "dev"]

  nginx:
    ports:
      - "80:80"
