name: Deploy to Azure VM

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            Backend/package-lock.json
            frontend/package-lock.json

      - name: Backend — install & type-check
        working-directory: Backend
        run: npm ci && npm run build

      - name: Frontend — install & type-check
        working-directory: frontend
        run: npm ci && npx tsc --noEmit

  deploy:
    name: SSH & Deploy
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key:      ${{ secrets.VM_SSH_KEY }}
          timeout:  600s
          script: |
            set -e
            if [ -d ~/skoolio ]; then
              cd ~/skoolio
            elif [ -d ~/School-ERP ]; then
              cd ~/School-ERP
            fi

            # ── Save current commit so we can rollback if needed ──
            PREVIOUS_COMMIT=$(git rev-parse HEAD)
            echo "Current commit: $PREVIOUS_COMMIT"

            # ── Pull latest code ──
            echo ">>> Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main
            NEW_COMMIT=$(git rev-parse HEAD)
            echo "New commit: $NEW_COMMIT"

            # ── Build and start ──
            echo ">>> Building containers..."
            if ! docker compose up -d --build --remove-orphans; then
              echo "!!! Build failed — rolling back to $PREVIOUS_COMMIT"
              git reset --hard $PREVIOUS_COMMIT
              docker compose up -d --build --remove-orphans
              echo "!!! Rollback complete"
              exit 1
            fi

            # ── Verify all containers are healthy ──
            echo ">>> Waiting for health checks..."
            sleep 35
            UNHEALTHY=$(docker compose ps --format json | grep -c '"Health":"unhealthy"' || true)
            if [ "$UNHEALTHY" -gt "0" ]; then
              echo "!!! Containers unhealthy — rolling back to $PREVIOUS_COMMIT"
              git reset --hard $PREVIOUS_COMMIT
              docker compose up -d --build --remove-orphans
              echo "!!! Rollback complete"
              exit 1
            fi

            # ── Cleanup ──
            echo ">>> Cleaning up old images..."
            docker image prune -f

            echo ">>> Deploy complete!"
            docker compose ps
