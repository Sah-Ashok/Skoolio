version: "3.9"

# =============================================================
#  Skoolio – Docker Compose  (production)
#
#  Services:
#    redis     – Redis 7 (local, replaces Azure Managed Redis)
#    backend   – Express / Node API    (internal port 5001)
#    frontend  – Next.js               (internal port 3000)
#    nginx     – Reverse proxy         (public   port 80 / 443)
#
#  External (Azure-managed):
#    PostgreSQL – Azure Database for PostgreSQL (stu-postgres)
#
#  Usage:
#    docker compose up -d --build
# =============================================================

services:

  # -----------------------------------------------------------
  # Redis – local container (replaces Azure Managed Redis)
  # No password needed – internal Docker network only
  # Memory limit: 256MB (plenty for OTP/session caching)
  # -----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: skoolio_redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    networks:
      - skoolio_net
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # -----------------------------------------------------------
  # Backend – Express / Node
  # -----------------------------------------------------------
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: skoolio_backend
    restart: unless-stopped
    env_file: ./Backend/.env
    environment:
      NODE_ENV: production
      PORT: 5001
      CORS_ORIGIN: http://nginx
      # Override Azure Redis with local container
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - skoolio_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5001/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # -----------------------------------------------------------
  # Frontend – Next.js
  # -----------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
    container_name: skoolio_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - skoolio_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # -----------------------------------------------------------
  # Nginx – reverse proxy
  # -----------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: skoolio_nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Uncomment when SSL certs are ready:
      # - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - skoolio_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

# =============================================================
# Networks
# =============================================================
networks:
  skoolio_net:
    driver: bridge

# =============================================================
# Volumes
# =============================================================
volumes:
  redis_data:
    driver: local
