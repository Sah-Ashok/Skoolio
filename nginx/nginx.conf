# =============================================================
#  Skoolio – Nginx reverse proxy
#
#  Routing table:
#    /api/auth/(login|register)  →  backend:5001  (strict rate limit)
#    /api/*                      →  backend:5001
#    /_next/static/*             →  frontend:3000  (1-year cache)
#    /_next/image                →  frontend:3000
#    /health                     →  200 ok  (no upstream, no logs)
#    /*                          →  frontend:3000  (Next.js)
# =============================================================

worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ----------------------------------------------------------
    # Logging
    # ----------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';

    access_log /var/log/nginx/access.log main;

    # ----------------------------------------------------------
    # Performance
    # ----------------------------------------------------------
    sendfile          on;
    tcp_nopush        on;
    tcp_nodelay       on;
    keepalive_timeout 65;

    # ----------------------------------------------------------
    # Gzip compression
    # ----------------------------------------------------------
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff2;

    # ----------------------------------------------------------
    # Rate limiting zones
    # ----------------------------------------------------------
    # General API  – 30 req/s per IP, burst of 60
    limit_req_zone $binary_remote_addr zone=api_limit:10m  rate=30r/s;
    # Auth routes  – 5 req/min per IP (login / register)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

    # ----------------------------------------------------------
    # Upstream services  (Docker internal hostnames)
    # ----------------------------------------------------------
    upstream frontend {
        server frontend:3000;
        keepalive 32;
    }

    upstream backend {
        server backend:5001;
        keepalive 32;
    }

    # ----------------------------------------------------------
    # HTTP → HTTPS redirect  (uncomment when SSL is ready)
    # ----------------------------------------------------------
    # server {
    #     listen 80;
    #     server_name skoolio.yourdomain.com;
    #     return 301 https://$host$request_uri;
    # }

    # ----------------------------------------------------------
    # Main server block
    # ----------------------------------------------------------
    server {
        listen 80;
        server_name _;

        # ── SSL (uncomment + add certs when ready) ────────────
        # listen 443 ssl http2;
        # server_name skoolio.yourdomain.com;
        #
        # ssl_certificate      /etc/nginx/certs/fullchain.pem;
        # ssl_certificate_key  /etc/nginx/certs/privkey.pem;
        # ssl_protocols        TLSv1.2 TLSv1.3;
        # ssl_ciphers          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        # ssl_session_cache    shared:SSL:10m;
        # ssl_session_timeout  1d;
        # ssl_stapling         on;
        # ssl_stapling_verify  on;
        # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        client_max_body_size 20M;

        # ── Security headers ──────────────────────────────────
        add_header X-Frame-Options        "SAMEORIGIN"                    always;
        add_header X-Content-Type-Options "nosniff"                       always;
        add_header X-XSS-Protection       "1; mode=block"                 always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

        # ── Health check – no upstream, no access log ─────────
        location = /health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # ── Auth endpoints – strict rate limit ────────────────
        location ~ ^/api/auth/(login|register) {
            limit_req zone=auth_limit burst=10 nodelay;

            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── All other API requests ────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=60 nodelay;

            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # ── Next.js immutable static assets (1-year cache) ───
        location /_next/static/ {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            add_header         Cache-Control "public, max-age=31536000, immutable";
            access_log         off;
        }

        # ── Next.js image optimisation endpoint ───────────────
        location /_next/image {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host      $host;
        }

        # ── Everything else → Next.js ─────────────────────────
        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }
}
